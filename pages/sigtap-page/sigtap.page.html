<section>
  <div class="table">
    <div class="search">
      <mat-form-field appearance="outline">
        <mat-label>Buscar</mat-label>
        <input matInput (keyup)="applyFilter($event)" placeholder="Buscar competência" #sigtapInput>
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>
    </div>
    
    <table mat-table [dataSource]="dataSource" matSort #sigtapSort="matSort">
      
      <!-- Coluna: Competência -->
      <ng-container matColumnDef="competence">
        <th mat-header-cell *matHeaderCellDef mat-sort-header class="name-column-header"> Competência </th>
        <td mat-cell *matCellDef="let element"> {{ formatCompetence(element.name) }} </td>
      </ng-container>
    
      <!-- Coluna: Ações -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="center actions-column-header"> Ações </th>
        <td mat-cell *matCellDef="let element" class="center actions-cell">
          <button mat-icon-button 
                  type="button" 
                  disabled
                  matTooltip="Competência ativa">
            <mat-icon class="valid">check</mat-icon>
          </button>
        </td>
      </ng-container>
    
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell center" [attr.colspan]="displayedColumns.length">
          <p>Nenhum resultado encontrado.</p>
        </td>
      </tr>
    </table>

    <mat-paginator 
      #sigtapPaginator 
      [pageSize]="8"
      [hidePageSize]="true">
    </mat-paginator>
  </div>
</section>
